name: Hermes catalog compatibility
on:
  pull_request:
    paths:
      - "plugin.yaml"
      - "__init__.py"
      - "unlimited/**"
      - "feedback_task_model/**"
      - ".github/workflows/catalog-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Hermes Unlimited
        uses: actions/checkout@v4
        with:
          path: plugin
      - name: Checkout Hermes upstream
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Hermes CLI
        run: python -m pip install -e ./hermes
      - name: Validate plugin and dependencies
        run: hermes plugins validate ./plugin --install-deps
