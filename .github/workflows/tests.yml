name: Public core tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests
        run: |
          python - <<'PY'
          import unittest
          media_modules = {"test_demo_pipeline", "test_demo_recorder", "test_screenplay_adapter"}
          def core_only(suite):
              for test in suite:
                  if isinstance(test, unittest.TestSuite):
                      yield from core_only(test)
                  elif test.__class__.__module__ not in media_modules:
                      yield test
          discovered = unittest.defaultTestLoader.discover("tests")
          suite = unittest.TestSuite(core_only(discovered))
          if suite.countTestCases() == 0:
              raise SystemExit("No core tests discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
